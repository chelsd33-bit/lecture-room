<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>강의실 라이브</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 레이아웃: 왼쪽은 강사가 띄운 프롬프트(짙은 슬랩), 오른쪽은 손든 질문 패널. 좁은 화면에서는 탭 전환. */
:root {
  --bg: #f3f4f8; --panel: #ffffff; --ink: #141a2e; --muted: #68718a; --line: #e2e5ee;
  --slab: #161c31; --slab-ink: #eef0fa; --slab-muted: #98a1c0; --slab-line: #2c3352; --slab-link: #a9b8ff;
  --accent: #3355ff; --accent-soft: #e9edff;
  --btn: #141a2e; --btn-ink: #ffffff;
  --mark: #ffd84d; --mark-ink: #3a2f00;
  --ok: #0f7f5b; --ok-soft: #dff4ea; --danger: #cf3a2b;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0e17; --panel: #121623; --ink: #eceef6; --muted: #8a92ab; --line: #222739;
    --slab: #181e33; --slab-ink: #eef0fa; --slab-muted: #8f98b8; --slab-line: #2b3353; --slab-link: #a9b8ff;
    --accent: #8298ff; --accent-soft: #1b2346;
    --btn: #eceef6; --btn-ink: #0b0e17;
    --mark: #f2c94c; --mark-ink: #2e2500;
    --ok: #52d0a2; --ok-soft: #12302a; --danger: #ff8a78;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font); -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 1.05em; height: 1.05em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 14px; white-space: nowrap; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.btn:hover { box-shadow: inset 0 0 0 1px var(--muted); }
.btn.primary { background: var(--btn); color: var(--btn-ink); box-shadow: none; }
.btn.primary:hover { opacity: 0.88; }
.btn.big { height: 46px; font-size: 15px; border-radius: 12px; }
.tool { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--muted); }
.tool:hover { background: var(--line); color: var(--ink); }
.tool.danger:hover, .tool[data-armed] { color: var(--danger); }
.field { width: 100%; height: 46px; border: 0; border-radius: 12px; padding: 0 14px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.field:focus { outline: 0; box-shadow: inset 0 0 0 2px var(--accent); }

/* ── 시작 화면 ── */
#home { min-height: 100%; display: grid; align-items: center; padding: 48px max(20px, env(safe-area-inset-right)) 48px max(20px, env(safe-area-inset-left)); }
.home-inner { width: 100%; max-width: 880px; margin: 0 auto; display: grid; gap: 40px; }
.brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.home-inner h1 { font-size: clamp(32px, 6.4vw, 56px); line-height: 1.18; font-weight: 800; letter-spacing: -0.035em; margin: 0; text-wrap: balance; word-break: keep-all; }
.home-inner .lede { margin: -22px 0 0; color: var(--muted); font-size: 17px; max-width: 34em; word-break: keep-all; }
.home-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.home-card { border-radius: 20px; padding: 26px; display: grid; gap: 14px; align-content: start; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.home-card h2 { font-size: 19px; margin: 0; letter-spacing: -0.02em; }
.home-card p { margin: -8px 0 4px; color: var(--muted); font-size: 14px; }
.home-card.dark { background: var(--slab); color: var(--slab-ink); box-shadow: inset 0 0 0 1px var(--slab-line); }
.home-card.dark p { color: var(--slab-muted); }
.home-card.dark .field { background: rgb(255 255 255 / 0.07); box-shadow: inset 0 0 0 1px var(--slab-line); color: var(--slab-ink); }
.home-card.dark .field::placeholder { color: var(--slab-muted); }
.home-card.dark .field:focus { box-shadow: inset 0 0 0 2px var(--slab-link); }
.home-card.dark .btn.primary { background: var(--mark); color: var(--mark-ink); }
#joinCode { font-weight: 700; font-size: 20px; letter-spacing: 0.3em; text-transform: uppercase; text-align: center; }
#joinCode::placeholder { font-weight: 500; color: var(--line); }
.error { color: var(--danger); font-size: 13px; min-height: 1.5em; margin: -6px 0 -8px !important; }
.home-card.dark .error { color: #ffb0a3; }

/* ── 강의실 ── */
#room { height: 100%; display: flex; flex-direction: column; }
header.bar { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px max(20px, env(safe-area-inset-right)) 10px max(20px, env(safe-area-inset-left)); background: var(--panel); border-bottom: 1px solid var(--line); }
.bar h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.host-badge { font-size: 12px; font-weight: 700; color: var(--mark-ink); background: var(--mark); border-radius: 6px; padding: 2px 8px; }
.live { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.live.off i { background: var(--danger); box-shadow: none; }
.codechip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 10px; background: var(--bg); font-weight: 700; letter-spacing: 0.14em; font-size: 15px; }
.codechip small { font-weight: 500; font-size: 12px; letter-spacing: 0; color: var(--muted); }

.tabs { display: none; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.seg { display: flex; padding: 3px; border-radius: 10px; background: var(--bg); gap: 2px; }
.seg button { flex: 1; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button[aria-selected=true], .seg button[aria-pressed=true] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: 2px; }

main.cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(340px, 34vw, 460px); }
.col { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
#colQuestions { background: var(--panel); border-left: 1px solid var(--line); }
.col-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 18px 24px 8px; min-height: 58px; }
.col-head h2 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.col-head h2 span { color: var(--muted); font-weight: 500; margin-left: 6px; font-variant-numeric: tabular-nums; }
.col-head .seg button { height: 26px; font-size: 12px; padding: 0 10px; }
.list { flex: 1; overflow-y: auto; padding: 8px 24px 24px; }
.wrap { width: 100%; max-width: 780px; margin: 0 auto; }
#postList .wrap { display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
#colPosts .col-head { max-width: 828px; width: 100%; margin: 0 auto; }
.empty { color: var(--muted); text-align: center; margin: auto; padding: 40px 12px; max-width: 30ch; word-break: keep-all; display: grid; justify-items: center; gap: 10px; }
.empty svg { width: 28px; height: 28px; opacity: 0.6; }

/* 강사 자료: 짙은 슬랩 */
.post { background: var(--slab); color: var(--slab-ink); border-radius: 16px; box-shadow: inset 0 0 0 1px var(--slab-line); }
.post-bar { display: flex; align-items: center; gap: 4px; padding: 10px 10px 0 18px; font-size: 12px; color: var(--slab-muted); }
.post-bar time { font-variant-numeric: tabular-nums; margin-right: auto; display: inline-flex; align-items: center; gap: 8px; }
.pin-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--mark); color: var(--mark-ink); font-weight: 700; border-radius: 6px; padding: 1px 7px 1px 5px; }
.post .tool { color: var(--slab-muted); }
.post .tool:hover { background: rgb(255 255 255 / 0.08); color: var(--slab-ink); }
.post .tool.danger:hover, .post .tool[data-armed] { color: #ff9c8c; }
.copy { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px; border-radius: 8px; font-size: 13px; font-weight: 600; background: rgb(255 255 255 / 0.1); color: var(--slab-ink); margin-left: 4px; }
.copy:hover { background: rgb(255 255 255 / 0.18); }
.copy.done { background: var(--ok); color: #fff; }
.post-body { padding: 8px 18px 18px; font-size: 16px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; }
.post-body a { color: var(--slab-link); text-underline-offset: 3px; }
@keyframes arrive { from { box-shadow: inset 0 0 0 2px var(--mark), 0 0 0 6px rgb(255 216 77 / 0.25); } }
.post.fresh { animation: arrive 1.6s ease-out; }
@keyframes arriveQ { from { background: var(--accent-soft); } }
.q.fresh { animation: arriveQ 1.6s ease-out; }
@media (prefers-reduced-motion: reduce) { .post.fresh, .q.fresh { animation: none; } }

/* 질문: 선으로만 나눈 목록 */
#qList { padding-top: 0; display: flex; flex-direction: column; }
.q { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 14px; padding: 16px 0; border-top: 1px solid var(--line); }
.q:first-child { border-top: 0; }
.hand { align-self: start; display: grid; justify-items: center; gap: 1px; width: 46px; padding: 8px 0 6px; border-radius: 12px; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); font-size: 15px; }
.hand b { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
.hand:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--muted); }
.hand[aria-pressed=true] { background: var(--accent); color: #fff; box-shadow: none; }
@media (prefers-color-scheme: dark) { .hand[aria-pressed=true] { color: #0b0e17; } }
.q-text { margin: 0; font-size: 15px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; font-weight: 500; }
.q.answered .q-text { color: var(--muted); font-weight: 400; }
.q-meta { margin-top: 4px; color: var(--muted); font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.tag { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; color: var(--ok); }
.q-reply { margin: 10px 0 0; padding: 10px 14px; border-radius: 4px 14px 14px 14px; background: var(--bg); font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.q-reply b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.q-reply a { color: var(--accent); }
.q-tools { display: flex; gap: 2px; flex-wrap: wrap; margin: 8px 0 -4px -8px; }

/* 입력창 */
.composer { padding: 10px 24px calc(16px + env(safe-area-inset-bottom)); }
.box { border-radius: 16px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line), 0 2px 10px rgb(20 26 46 / 0.05); }
#colQuestions .box { background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); }
.box:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
.box textarea { display: block; width: 100%; border: 0; background: none; resize: none; padding: 14px 16px 4px; min-height: 52px; max-height: 40vh; line-height: 1.55; }
.box textarea:focus { outline: 0; }
#postText { min-height: 84px; font-size: 16px; }
.box-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px 8px 16px; }
.box-foot .hint { color: var(--muted); font-size: 12px; }
#qName { border: 0; background: none; min-width: 0; flex: 1; font-size: 13px; padding: 4px 0; }
#qName:focus { outline: 0; }
.send { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 10px; background: var(--btn); color: var(--btn-ink); font-weight: 600; font-size: 14px; white-space: nowrap; }
.send:hover { opacity: 0.88; }

dialog { border: 0; border-radius: 22px; background: var(--panel); color: var(--ink); padding: 28px; width: min(92vw, 460px); box-shadow: 0 24px 80px rgb(0 0 0 / 0.35); }
dialog::backdrop { background: rgb(8 10 20 / 0.6); backdrop-filter: blur(3px); }
dialog h3 { margin: 0 0 12px; font-size: 19px; letter-spacing: -0.02em; }
dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
#inviteDialog { width: min(94vw, 520px); text-align: center; }
#inviteDialog h3 { font-size: 22px; }
#qrBox { background: #fff; border-radius: 16px; padding: 12px; display: inline-block; max-width: 100%; box-shadow: inset 0 0 0 1px var(--line); }
#qrBox svg { display: block; width: min(64vw, 320px); height: auto; }
#inviteCode { font-size: 44px; font-weight: 800; letter-spacing: 0.2em; margin: 14px 0 0; line-height: 1.2; padding-left: 0.2em; }
#inviteUrl { color: var(--muted); overflow-wrap: anywhere; margin: 2px 0 0; font-size: 14px; }
#inviteDialog .row { justify-content: center; }
#replyQuote { color: var(--muted); margin: 0 0 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 6.5em; overflow: auto; }
#replyDialog .box { background: var(--bg); }
#replyDialog textarea { padding-bottom: 14px; min-height: 110px; }

#toast { position: fixed; left: 50%; top: calc(72px + env(safe-area-inset-top)); transform: translateX(-50%); background: var(--btn); color: var(--btn-ink); padding: 9px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 20; max-width: 90vw; box-shadow: 0 8px 30px rgb(0 0 0 / 0.25); }

@media (max-width: 820px) {
  .tabs { display: block; }
  main.cols { grid-template-columns: minmax(0, 1fr); }
  #colQuestions { border-left: 0; }
  main.cols[data-tab=posts] #colQuestions, main.cols[data-tab=questions] #colPosts { display: none; }
  header.bar { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); gap: 8px; }
  .codechip small, .btn-label, .live-label { display: none; }
  .btn.icon-only-sm { width: 36px; padding: 0; }
  .col-head { padding: 12px 16px 6px; min-height: 0; }
  #colPosts .col-head { display: none; }
  .list { padding: 12px 16px 16px; }
  #qList { padding-top: 0; }
  .composer { padding: 8px 12px calc(12px + env(safe-area-inset-bottom)); }
  .post-body { font-size: 15px; }
}
</style>
</head>
<body>

<!-- 시작 화면 -->
<section id="home" hidden>
  <div class="home-inner">
    <span class="brand"><i></i>강의실 라이브</span>
    <h1>프롬프트는 화면에 띄우고, 질문은 손을 들어 받으세요.</h1>
    <p class="lede">강사가 올린 프롬프트는 모든 수강생 화면에 바로 나타납니다. 수강생은 가입 없이 QR 코드로 들어와 복사하고 질문합니다.</p>
    <div class="home-cards">
      <form class="home-card dark" id="createForm">
        <h2>강의실 만들기</h2>
        <p>강사용입니다. 만든 브라우저가 강사 권한을 갖습니다.</p>
        <input class="field" type="text" id="createTitle" maxlength="60" placeholder="강의 제목" autocomplete="off">
        <button class="btn primary big" type="submit">강의실 만들기</button>
        <p class="error" id="createError" role="alert"></p>
      </form>
      <form class="home-card" id="joinForm">
        <h2>강의실 입장</h2>
        <p>강사가 알려준 6자리 코드를 입력하세요.</p>
        <input class="field" type="text" id="joinCode" maxlength="6" placeholder="ABC234" autocomplete="off" autocapitalize="characters" aria-label="강의실 코드">
        <button class="btn primary big" type="submit">입장</button>
        <p class="error" id="joinError" role="alert"></p>
      </form>
    </div>
  </div>
</section>

<!-- 강의실 -->
<section id="room" hidden>
  <header class="bar">
    <h1 id="roomTitle"></h1>
    <span class="host-badge" id="hostBadge" hidden>강사</span>
    <span class="live" id="live"><i></i><span id="online">연결 중</span></span>
    <span class="codechip" title="강의실 코드"><small>입장 코드</small><span id="roomCode"></span></span>
    <button class="btn primary icon-only-sm" id="btnInvite" aria-label="초대"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM21 14v.01M14 21v.01M21 21v.01M17.5 17.5H21"/></svg><span class="btn-label">초대</span></button>
  </header>

  <nav class="tabs">
    <div class="seg" role="tablist">
      <button role="tab" id="tabPosts" aria-selected="true">강사 자료<span class="dot" hidden></span></button>
      <button role="tab" id="tabQuestions" aria-selected="false">질문<span class="dot" hidden></span></button>
    </div>
  </nav>

  <main class="cols" id="cols" data-tab="posts">
    <section class="col" id="colPosts">
      <div class="col-head"><h2>강사 자료<span id="postCount"></span></h2></div>
      <div class="list" id="postList"><div class="wrap" id="postWrap"></div></div>
      <form class="composer" id="postForm" hidden>
        <div class="wrap box">
          <textarea id="postText" maxlength="8000" placeholder="프롬프트, 코드, 링크를 붙여 넣으세요" aria-label="공유할 내용"></textarea>
          <div class="box-foot">
            <span class="hint">Ctrl(⌘) + Enter</span>
            <button class="send" type="submit">공유<svg class="i" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button>
          </div>
        </div>
      </form>
    </section>

    <section class="col" id="colQuestions">
      <div class="col-head">
        <h2>질문<span id="qCount"></span></h2>
        <div class="seg" id="sortSeg">
          <button type="button" data-sort="votes" aria-pressed="true">공감순</button>
          <button type="button" data-sort="recent" aria-pressed="false">최신순</button>
        </div>
      </div>
      <div class="list" id="qList"></div>
      <form class="composer" id="qForm">
        <div class="box">
          <textarea id="qText" maxlength="1000" rows="1" placeholder="궁금한 점을 물어보세요" aria-label="질문"></textarea>
          <div class="box-foot">
            <input type="text" id="qName" maxlength="30" placeholder="이름 (비우면 익명)" autocomplete="nickname" aria-label="이름">
            <button class="send" type="submit">질문하기</button>
          </div>
        </div>
      </form>
    </section>
  </main>
</section>

<dialog id="inviteDialog">
  <h3>카메라로 찍으면 바로 입장합니다</h3>
  <div id="qrBox"></div>
  <p id="inviteCode"></p>
  <p id="inviteUrl"></p>
  <div class="row">
    <button class="btn primary" id="btnCopyInvite">초대 링크 복사</button>
    <button class="btn" id="btnHostLink" hidden title="다른 기기에서 강사로 접속할 때 쓰는 링크">강사용 링크 복사</button>
    <button class="btn" data-close>닫기</button>
  </div>
</dialog>

<dialog id="replyDialog">
  <h3>답변 달기</h3>
  <p id="replyQuote"></p>
  <div class="box"><textarea id="replyText" maxlength="2000" placeholder="답변 (비워 두면 '답변 완료' 표시만 합니다)" aria-label="답변"></textarea></div>
  <div class="row">
    <button class="btn" data-close>취소</button>
    <button class="btn primary" id="replySave">답변 완료로 표시</button>
  </div>
</dialog>

<div id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const el = (tag, cls, txt) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  };
  // 고정된 문자열만 넣는 아이콘
  const ICONS = {
    copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    pin: '<path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>',
    hand: '<path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
    board: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/>',
  };
  const icon = (name) => {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', 'i'); s.setAttribute('aria-hidden', 'true');
    s.innerHTML = ICONS[name]; return s;
  };

  let toastTimer;
  function toast(msg) {
    $('toast').textContent = msg; $('toast').hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('toast').hidden = true; }, 2200);
  }

  async function call(method, url, body) {
    let res;
    try {
      res = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    } catch { throw new Error('서버에 연결하지 못했습니다. 네트워크를 확인해 주세요.'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || '요청을 처리하지 못했습니다.');
    return data;
  }

  async function copy(textToCopy, okMsg) {
    try { await navigator.clipboard.writeText(textToCopy); }
    catch {
      const ta = el('textarea'); ta.value = textToCopy; document.body.append(ta); ta.select();
      try { document.execCommand('copy'); } finally { ta.remove(); }
    }
    if (okMsg) toast(okMsg);
  }

  // 본문 속 URL을 링크로 (textContent만 사용)
  function fillLinked(node, str) {
    const re = /https?:\/\/[^\s<>"']+/g; let last = 0, m;
    while ((m = re.exec(str))) {
      node.append(str.slice(last, m.index));
      const a = el('a', null, m[0]); a.href = m[0]; a.target = '_blank'; a.rel = 'noopener noreferrer';
      node.append(a); last = m.index + m[0].length;
    }
    node.append(str.slice(last));
  }
  const hhmm = (ts) => new Date(ts).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });

  // ── 시작 화면 ──
  const match = location.pathname.match(/^\/r\/([A-Za-z0-9]{6})\/?$/);
  if (!match) {
    $('home').hidden = false;
    $('createForm').addEventListener('submit', async (e) => {
      e.preventDefault(); $('createError').textContent = '';
      try {
        const r = await call('POST', '/api/rooms', { title: $('createTitle').value });
        store.set('host:' + r.code, r.hostKey);
        location.href = '/r/' + r.code;
      } catch (err) { $('createError').textContent = err.message; }
    });
    $('joinForm').addEventListener('submit', async (e) => {
      e.preventDefault(); $('joinError').textContent = '';
      const code = $('joinCode').value.trim().toUpperCase();
      if (code.length !== 6) { $('joinError').textContent = '코드 6자리를 입력해 주세요.'; return; }
      try { await call('GET', '/api/rooms/' + code); location.href = '/r/' + code; }
      catch (err) { $('joinError').textContent = err.message; }
    });
    return;
  }

  // ── 강의실 ──
  const code = match[1].toUpperCase();
  const base = '/api/rooms/' + code;
  const inviteUrl = location.origin + '/r/' + code;

  const hashKey = new URLSearchParams(location.hash.slice(1)).get('host');
  if (hashKey) { store.set('host:' + code, hashKey); history.replaceState(null, '', location.pathname); }
  let hostKey = store.get('host:' + code) || '';
  let isHost = false;

  let clientId = store.get('clientId');
  if (!clientId) { clientId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); store.set('clientId', clientId); }
  let voted = new Set(JSON.parse(store.get('voted:' + code) || '[]'));
  let sortByVotes = true;
  let state = null;
  let seen = { posts: 0, questions: 0 };
  let known = null;            // 이미 본 글 id (새 글 강조용)
  let copiedId = null;

  $('room').hidden = false;
  $('roomCode').textContent = code;
  $('qName').value = store.get('name') || '';
  document.title = '강의실 ' + code;

  function setTab(tab) {
    $('cols').dataset.tab = tab;
    $('tabPosts').setAttribute('aria-selected', tab === 'posts');
    $('tabQuestions').setAttribute('aria-selected', tab === 'questions');
    $(tab === 'posts' ? 'tabPosts' : 'tabQuestions').querySelector('.dot').hidden = true;
  }
  $('tabPosts').onclick = () => setTab('posts');
  $('tabQuestions').onclick = () => setTab('questions');

  function emptyState(iconName, msg) {
    const p = el('p', 'empty'); p.append(icon(iconName), el('span', null, msg)); return p;
  }

  function renderPosts(fresh) {
    const list = $('postWrap'); list.replaceChildren();
    const posts = [...state.posts].sort((a, b) => (b.pinned - a.pinned) || (b.at - a.at));
    $('postCount').textContent = posts.length || '';
    if (!posts.length) {
      list.append(emptyState('board', isHost ? '아래에 프롬프트를 붙여 넣고 공유하면 수강생 화면에 바로 나타납니다.' : '강사가 프롬프트나 자료를 공유하면 여기에 바로 나타납니다.'));
      return;
    }
    for (const p of posts) {
      const card = el('article', 'post' + (fresh.has(p.id) ? ' fresh' : ''));
      const bar = el('div', 'post-bar');
      const t = el('time');
      if (p.pinned) { const chip = el('span', 'pin-chip'); chip.append(icon('pin'), '고정'); t.append(chip); }
      t.append(hhmm(p.at));
      bar.append(t);
      if (isHost) {
        const pin = el('button', 'tool', p.pinned ? '고정 해제' : '고정');
        pin.onclick = () => act('POST', `${base}/posts/${p.id}/pin`, { hostKey });
        const del = el('button', 'tool danger', '삭제');
        del.onclick = () => confirmTwice(del, () => act('DELETE', `${base}/posts/${p.id}`, { hostKey }));
        bar.append(pin, del);
      }
      const done = copiedId === p.id;
      const btnCopy = el('button', 'copy' + (done ? ' done' : ''));
      btnCopy.append(icon(done ? 'check' : 'copy'), done ? '복사됨' : '복사');
      btnCopy.onclick = async () => {
        await copy(p.text); copiedId = p.id; renderPosts(new Set());
        setTimeout(() => { if (copiedId === p.id) { copiedId = null; renderPosts(new Set()); } }, 1800);
      };
      bar.append(btnCopy);
      const body = el('div', 'post-body'); fillLinked(body, p.text);
      card.append(bar, body); list.append(card);
    }
  }

  function renderQuestions(fresh) {
    const list = $('qList'); list.replaceChildren();
    const open = state.questions.filter((q) => !q.answered).length;
    $('qCount').textContent = state.questions.length ? (open ? `${open}개 대기` : '모두 답변함') : '';
    if (!state.questions.length) {
      list.append(emptyState('hand', isHost ? '아직 질문이 없습니다. 수강생이 질문을 남기면 여기에 나타납니다.' : '아직 질문이 없습니다. 궁금한 점을 아래에 남겨 보세요.'));
      return;
    }
    const qs = [...state.questions].sort((a, b) =>
      (a.answered - b.answered) || (sortByVotes ? b.votes - a.votes : 0) || (b.at - a.at));
    for (const q of qs) {
      const card = el('article', 'q' + (q.answered ? ' answered' : '') + (fresh.has(q.id) ? ' fresh' : ''));
      const vote = el('button', 'hand');
      vote.setAttribute('aria-pressed', voted.has(q.id));
      vote.setAttribute('aria-label', '나도 궁금해요, 현재 ' + q.votes + '명');
      vote.title = '나도 궁금해요';
      vote.append(icon('hand'), el('b', null, q.votes));
      vote.onclick = async () => {
        try {
          const r = await call('POST', `${base}/questions/${q.id}/vote`, { clientId });
          r.voted ? voted.add(q.id) : voted.delete(q.id);
          store.set('voted:' + code, JSON.stringify([...voted]));
          renderQuestions(new Set());
        } catch (err) { toast(err.message); }
      };
      const main = el('div');
      main.append(el('p', 'q-text', q.text));
      const meta = el('div', 'q-meta');
      meta.append(el('span', null, q.name), el('span', null, hhmm(q.at)));
      if (q.answered) { const tag = el('span', 'tag'); tag.append(icon('check'), '답변 완료'); meta.append(tag); }
      main.append(meta);
      if (q.reply) {
        const reply = el('p', 'q-reply'); reply.append(el('b', null, '강사'));
        fillLinked(reply, q.reply); main.append(reply);
      }
      if (isHost) {
        const tools = el('div', 'q-tools');
        const ans = el('button', 'tool', q.answered ? '답변 수정' : '답변');
        ans.onclick = () => openReply(q);
        tools.append(ans);
        if (q.answered) {
          const undo = el('button', 'tool', '대기로 되돌리기');
          undo.onclick = () => act('POST', `${base}/questions/${q.id}/answer`, { hostKey, answered: false });
          tools.append(undo);
        }
        const del = el('button', 'tool danger', '삭제');
        del.onclick = () => confirmTwice(del, () => act('DELETE', `${base}/questions/${q.id}`, { hostKey }));
        tools.append(del); main.append(tools);
      }
      card.append(vote, main);
      list.append(card);
    }
  }

  // 삭제는 같은 버튼을 한 번 더 눌러 확인
  function confirmTwice(btn, fn) {
    if (btn.dataset.armed) return fn();
    btn.dataset.armed = '1'; const old = btn.textContent; btn.textContent = '한 번 더 눌러 삭제';
    setTimeout(() => { delete btn.dataset.armed; btn.textContent = old; }, 2500);
  }
  async function act(method, url, body) {
    try { await call(method, url, body); } catch (err) { toast(err.message); }
  }

  function render() {
    $('roomTitle').textContent = state.title;
    document.title = state.title + ' | 강의실 라이브';
    $('online').replaceChildren(String(state.online), el('span', 'live-label', '명 접속 중'));
    const ids = [...state.posts, ...state.questions].map((x) => x.id);
    const fresh = new Set(known ? ids.filter((i) => !known.has(i)) : []);
    known = new Set(ids);
    renderPosts(fresh); renderQuestions(fresh);
    // 다른 탭에 새 글이 오면 점 표시 (좁은 화면)
    const tab = $('cols').dataset.tab;
    if (state.posts.length > seen.posts && tab !== 'posts') $('tabPosts').querySelector('.dot').hidden = false;
    if (state.questions.length > seen.questions && tab !== 'questions') $('tabQuestions').querySelector('.dot').hidden = false;
    seen = { posts: state.posts.length, questions: state.questions.length };
  }

  function applyHost() {
    $('hostBadge').hidden = !isHost; $('btnHostLink').hidden = !isHost; $('postForm').hidden = !isHost;
    $('qForm').hidden = isHost;
    if (state) render();
  }

  // 실시간 연결
  function connect() {
    const es = new EventSource(base + '/events');
    es.onmessage = (e) => { state = JSON.parse(e.data); $('live').classList.remove('off'); render(); };
    es.onerror = () => { $('live').classList.add('off'); $('online').textContent = '다시 연결하는 중'; };
  }

  call('GET', base + (hostKey ? '?hostKey=' + encodeURIComponent(hostKey) : '')).then((r) => {
    isHost = r.isHost; $('roomTitle').textContent = r.title; applyHost(); connect();
  }).catch((err) => {
    $('room').hidden = true; $('home').hidden = false; $('joinError').textContent = err.message;
    $('joinCode').value = code;
    $('joinForm').addEventListener('submit', (e) => { e.preventDefault(); location.href = '/r/' + $('joinCode').value.trim().toUpperCase(); });
    $('createForm').addEventListener('submit', (e) => { e.preventDefault(); location.href = '/'; });
  });

  // 입력창 높이를 내용에 맞춤
  const autosize = (ta) => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
  for (const id of ['postText', 'qText']) $(id).addEventListener('input', (e) => autosize(e.target));

  // 강사: 자료 공유
  $('postForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const t = $('postText').value.trim(); if (!t) return;
    try { await call('POST', base + '/posts', { hostKey, text: t }); $('postText').value = ''; autosize($('postText')); }
    catch (err) { toast(err.message); }
  });
  $('postText').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('postForm').requestSubmit(); }
  });

  // 수강생: 질문
  $('qForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const t = $('qText').value.trim(); if (!t) return;
    const name = $('qName').value.trim(); store.set('name', name);
    try { await call('POST', base + '/questions', { clientId, name, text: t }); $('qText').value = ''; autosize($('qText')); }
    catch (err) { toast(err.message); }
  });
  $('qText').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('qForm').requestSubmit(); }
  });

  $('sortSeg').querySelectorAll('button').forEach((b) => {
    b.onclick = () => {
      sortByVotes = b.dataset.sort === 'votes';
      $('sortSeg').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
      if (state) renderQuestions(new Set());
    };
  });

  // 답변
  let replyTarget = null;
  function openReply(q) {
    replyTarget = q.id; $('replyQuote').textContent = q.text; $('replyText').value = q.reply || '';
    $('replyDialog').showModal(); $('replyText').focus();
  }
  $('replySave').onclick = async () => {
    await act('POST', `${base}/questions/${replyTarget}/answer`, { hostKey, answered: true, reply: $('replyText').value });
    $('replyDialog').close();
  };

  // 초대
  $('btnInvite').onclick = () => {
    $('inviteUrl').textContent = inviteUrl.replace(/^https?:\/\//, ''); $('inviteCode').textContent = code;
    if (typeof qrcode === 'function') {
      const qr = qrcode(0, 'M'); qr.addData(inviteUrl); qr.make();
      $('qrBox').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 1, scalable: true });
    } else { $('qrBox').hidden = true; }
    $('inviteDialog').showModal();
  };
  $('btnCopyInvite').onclick = () => copy(inviteUrl, '초대 링크를 복사했습니다');
  $('btnHostLink').onclick = () => copy(inviteUrl + '#host=' + hostKey, '강사용 링크를 복사했습니다. 수강생에게는 공유하지 마세요.');
  document.querySelectorAll('[data-close]').forEach((b) => { b.onclick = () => b.closest('dialog').close(); });
})();
</script>
</body>
</html>
